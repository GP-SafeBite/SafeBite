name: safebite
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  mobile_scanner: ^5.2.3
  http: ^1.2.0
  webview_flutter: ^4.4.2
  dart_rss: ^3.0.2
  image_picker: ^1.0.7
  camera: ^0.12.0
  google_generative_ai: ^0.4.0
  provider: ^6.0.5
  get_storage: ^2.1.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/allergies14/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700